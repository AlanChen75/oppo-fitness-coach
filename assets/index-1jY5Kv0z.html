<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 健身教練</title>
<meta name="description" content="Local-first AI 健身教練 PWA">
<meta name="theme-color" content="#0ea5e9">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
</head>
<body>
<main class="shell">
  <header class="home-header">
    <h1 class="home-title">AI 健身教練</h1>
    <nav class="home-nav" aria-label="頁面導覽">
      <a class="home-nav-link" href="./review.html">紀錄</a>
      <a class="home-nav-link" href="./more.html">更多</a>
    </nav>
  </header>

  <div class="tier-tabs" role="tablist" aria-label="動作等級">
    <button
      type="button"
      class="tier-tab is-active"
      role="tab"
      id="tab-beginner"
      aria-selected="true"
      aria-controls="panel-beginner"
      data-tier="beginner"
    >初級</button>
    <button
      type="button"
      class="tier-tab"
      role="tab"
      id="tab-intermediate"
      aria-selected="false"
      aria-controls="panel-intermediate"
      data-tier="intermediate"
    >中級</button>
    <button
      type="button"
      class="tier-tab"
      role="tab"
      id="tab-advanced"
      aria-selected="false"
      aria-controls="panel-advanced"
      data-tier="advanced"
    >高階</button>
    <button
      type="button"
      class="tier-tab"
      role="tab"
      id="tab-machine"
      aria-selected="false"
      aria-controls="panel-machine"
      data-tier="machine"
    >器械</button>
  </div>

  <div id="exercise-catalog"></div>
</main>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
